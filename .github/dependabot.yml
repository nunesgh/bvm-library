# Opens a pull request when an action that the workflows pin to a commit has a new release. Minor
# and patch releases come together in one pull request; each major release comes alone, for its own
# review. The group lists its update types: without them it would take the majors in as well.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
